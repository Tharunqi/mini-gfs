syntax = "proto3";

package gfs;

option go_package = "github.com/Tharunqi/mini-gfs/internal/pb";

import "common.proto";

message WriteChunkRequest {
    ChunkHandle chunk_handle = 1;

    // Byte offset within the chunk
    uint64 offset = 2;

    // Data to write
    bytes data = 3;

    repeated ServerInfo replicas = 4;
}

message WriteChunkResponse {
    Status status = 1;
}

message ReadChunkRequest {
    ChunkHandle chunk_handle = 1;

    // Starting byte
    uint64 offset = 2;

    // Number of bytes to read
    uint64 length = 3;
}

message ReadChunkResponse {
    Status status = 1;

    bytes data = 2;
}

message DeleteChunkRequest {
    ChunkHandle chunk_handle = 1;
}

message DeleteChunkResponse {
    Status status = 1;
}

message TruncateChunkRequest{
    ChunkHandle chunk_handle = 1;
    uint64 size = 2;
    bool replica_only = 3;
}

message TruncateChunkResponse{
    Status status = 1;
}

message ReplicateChunkRequest {
    ChunkHandle chunk_handle = 1;

    ServerInfo destination = 2;
}

message ReplicateChunkResponse {
    Status status = 1;
}

message ForwardWriteRequest {
    ChunkHandle chunk_handle = 1;
    uint64 offset = 2;
    bytes data = 3;
}

message ForwardWriteResponse {
    Status status = 1;
}

message DeleteReplicaChunkRequest {
    ChunkHandle chunk_handle = 1;
}

message DeleteReplicaChunkResponse {
    Status status = 1;
}

service ChunkService {

    rpc WriteChunk(WriteChunkRequest)
        returns (WriteChunkResponse);

    rpc ReadChunk(ReadChunkRequest)
        returns (ReadChunkResponse);

    rpc DeleteChunk(DeleteChunkRequest)
        returns (DeleteChunkResponse);

    rpc TruncateChunk(TruncateChunkRequest) returns (TruncateChunkResponse);

    rpc ReplicateChunk(ReplicateChunkRequest) returns (ReplicateChunkResponse);

    rpc ForwardWrite(ForwardWriteRequest) returns (ForwardWriteResponse);

    rpc DeleteReplicaChunk(DeleteReplicaChunkRequest) returns (DeleteReplicaChunkResponse);
}